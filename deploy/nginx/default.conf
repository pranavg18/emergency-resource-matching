server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /healthz { default_type application/json; return 200 '{"status":"ok"}'; }
    location /requests { set $upstream request-service:8000; proxy_pass http://$upstream; }
    location /resources { set $upstream resource-service:8000; proxy_pass http://$upstream; }
    location /match { set $upstream matching-service:8000; proxy_pass http://$upstream; }
}
