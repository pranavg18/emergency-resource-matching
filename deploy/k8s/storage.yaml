# Storage layer: 3 shards x 2 nodes. One StatefulSet per node rather than per
# shard, so a single node can be held down for the failure demo:
#   kubectl -n emergency scale statefulset storage-s1-a --replicas=0
# and brought back, volume intact, with --replicas=1.
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  clusterIP: None  # headless: gives each pod a stable DNS name
  # Keep DNS for pods that are not ready yet: the coordinator must reach a
  # starting or SYNCING node. Who may serve reads is the coordinator's call.
  publishNotReadyAddresses: true
  selector: {app: storage-node}
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-s0-a
  labels: {app: storage-node, shard: "0"}
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels: {app: storage-node, node: "s0-a"}
  template:
    metadata:
      labels: {app: storage-node, node: "s0-a", shard: "0"}
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        fsGroup: 10001  # makes the volume writable by the image's non-root user
      containers:
        - name: storage-node
          image: emergency/storage-node:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - {name: NODE_ID, value: "s0-a"}
            - {name: SHARD_ID, value: "0"}
            - {name: NODE_URL, value: "http://storage-s0-a-0.storage:8080"}
            - {name: DATA_DIR, value: /data}
          envFrom:
            - configMapRef: {name: storage-config}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 192Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 256Mi}
---
