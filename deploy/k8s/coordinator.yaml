apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels: {app: coordinator}
spec:
  replicas: 1  # exactly one: the registry lives in its memory
  strategy:
    type: Recreate  # never run two coordinators at once, not even during a rollout
  selector:
    matchLabels: {app: coordinator}
  template:
    metadata:
      labels: {app: coordinator}
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: coordinator
          image: emergency/coordinator:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: storage-config}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            # Lenient: a restart wipes the in-memory registry and in-sync sets.
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  selector: {app: coordinator}
  ports:
    - port: 8000
      targetPort: 8000
