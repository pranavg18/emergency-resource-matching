apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emergency
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /requests
            pathType: Prefix
            backend:
              service: {name: request-service, port: {number: 8000}}
          - path: /resources
            pathType: Prefix
            backend:
              service: {name: resource-service, port: {number: 8000}}
          - path: /match
            pathType: Prefix
            backend:
              service: {name: matching-service, port: {number: 8000}}
          - path: /healthz
            pathType: Exact
            backend:
              service: {name: request-service, port: {number: 8000}}
          - path: /readyz
            pathType: Exact
            backend:
              service: {name: request-service, port: {number: 8000}}
