        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "storage-s2-b": {
      "build": "./storage_node",
      "environment": {
        "NODE_ID": "storage-s2-b",
        "SHARD_ID": "2",
        "NODE_URL": "http://storage-s2-b:8080",
        "DATA_DIR": "/data",
        "COORDINATOR_URL": "http://coordinator:8000"
      },
      "volumes": [
        "storage-s2-b-data:/data"
      ],
      "depends_on": {
