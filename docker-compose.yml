{
  "name": "emergency-day1",
  "services": {
    "coordinator": {
      "build": "./coordinator",
      "ports": [
        "127.0.0.1:${COORDINATOR_PORT:-8008}:8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "rabbitmq": {
      "image": "rabbitmq:3.13-management",
      "hostname": "rabbitmq",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "emergency",
        "RABBITMQ_DEFAULT_PASS": "local-dev"
      },
      "ports": [
        "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15678}:15672"
      ],
      "volumes": [
        "rabbitmq-data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      }
    },
    "storage-s0-a": {
      "build": "./storage_node",
      "environment": {
        "NODE_ID": "storage-s0-a",
        "SHARD_ID": "0",
        "NODE_URL": "http://storage-s0-a:8080",
        "DATA_DIR": "/data",
        "COORDINATOR_URL": "http://coordinator:8000"
      },
      "volumes": [
        "storage-s0-a-data:/data"
      ],
      "depends_on": {
        "coordinator": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "storage-s0-b": {
      "build": "./storage_node",
      "environment": {
        "NODE_ID": "storage-s0-b",
        "SHARD_ID": "0",
        "NODE_URL": "http://storage-s0-b:8080",
        "DATA_DIR": "/data",
        "COORDINATOR_URL": "http://coordinator:8000"
      },
      "volumes": [
        "storage-s0-b-data:/data"
      ],
      "depends_on": {
        "coordinator": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "storage-s1-a": {
      "build": "./storage_node",
      "environment": {
        "NODE_ID": "storage-s1-a",
        "SHARD_ID": "1",
        "NODE_URL": "http://storage-s1-a:8080",
        "DATA_DIR": "/data",
        "COORDINATOR_URL": "http://coordinator:8000"
      },
      "volumes": [
        "storage-s1-a-data:/data"
      ],
      "depends_on": {
        "coordinator": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "storage-s1-b": {
      "build": "./storage_node",
      "environment": {
        "NODE_ID": "storage-s1-b",
        "SHARD_ID": "1",
        "NODE_URL": "http://storage-s1-b:8080",
        "DATA_DIR": "/data",
        "COORDINATOR_URL": "http://coordinator:8000"
      },
      "volumes": [
        "storage-s1-b-data:/data"
      ],
      "depends_on": {
        "coordinator": {
