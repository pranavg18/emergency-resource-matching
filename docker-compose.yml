        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "request-service": {
      "build": {
        "context": ".",
        "dockerfile": "services/request_service/Dockerfile"
      },
      "environment": {
        "COORDINATOR_URL": "http://coordinator:8000",
        "RABBITMQ_URL": "amqp://emergency:local-dev@rabbitmq:5672/",
        "MAX_RADIUS_KM": "${MAX_RADIUS_KM:-50}",
        "MAX_ATTEMPTS": "${MAX_ATTEMPTS:-5}",
        "MATCH_DELAY_MS": "${MATCH_DELAY_MS:-0}",
        "SWEEP_INTERVAL_S": "${SWEEP_INTERVAL_S:-30}",
        "RETRY_DELAY_MS": "${RETRY_DELAY_MS:-5000}"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "resource-service": {
      "build": {
        "context": ".",
        "dockerfile": "services/resource_service/Dockerfile"
      },
      "environment": {
        "COORDINATOR_URL": "http://coordinator:8000",
        "RABBITMQ_URL": "amqp://emergency:local-dev@rabbitmq:5672/",
        "MAX_RADIUS_KM": "${MAX_RADIUS_KM:-50}",
        "MAX_ATTEMPTS": "${MAX_ATTEMPTS:-5}",
        "MATCH_DELAY_MS": "${MATCH_DELAY_MS:-0}",
        "SWEEP_INTERVAL_S": "${SWEEP_INTERVAL_S:-30}",
        "RETRY_DELAY_MS": "${RETRY_DELAY_MS:-5000}"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "matching-service": {
      "build": {
        "context": ".",
        "dockerfile": "services/matching_service/Dockerfile"
      },
      "environment": {
        "COORDINATOR_URL": "http://coordinator:8000",
        "RABBITMQ_URL": "amqp://emergency:local-dev@rabbitmq:5672/",
        "MAX_RADIUS_KM": "${MAX_RADIUS_KM:-50}",
        "MAX_ATTEMPTS": "${MAX_ATTEMPTS:-5}",
        "MATCH_DELAY_MS": "${MATCH_DELAY_MS:-0}",
        "SWEEP_INTERVAL_S": "${SWEEP_INTERVAL_S:-30}",
        "RETRY_DELAY_MS": "${RETRY_DELAY_MS:-5000}"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "nginx": {
      "image": "nginx:1.27-alpine",
      "ports": [
        "127.0.0.1:${API_PORT:-8088}:80"
      ],
      "volumes": [
        "./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
      ],
      "depends_on": {
        "request-service": {
          "condition": "service_healthy"
        },
        "resource-service": {
          "condition": "service_healthy"
        },
        "matching-service": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/healthz"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    }
  },
  "volumes": {
    "rabbitmq-data": {},
    "storage-s0-a-data": {},
    "storage-s0-b-data": {},
    "storage-s1-a-data": {},
    "storage-s1-b-data": {},
    "storage-s2-a-data": {},
    "storage-s2-b-data": {}
  }
}
