        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12
      }
    },
    "storage-s2-a": {
      "build": "./storage_node",
      "environment": {
        "NODE_ID": "storage-s2-a",
        "SHARD_ID": "2",
        "NODE_URL": "http://storage-s2-a:8080",
        "DATA_DIR": "/data",
        "COORDINATOR_URL": "http://coordinator:8000"
